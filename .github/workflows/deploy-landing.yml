name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/dependabot.yml'
      - '.github/workflows/deploy-landing.yml'
      - 'scripts/verify-landing-surface.sh'
      - 'mesher/README.md'
      - 'mesher/landing/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-landing:
    name: Build landing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mesher/landing/package-lock.json

      - name: Verify landing surface contract
        shell: bash
        run: bash scripts/verify-landing-surface.sh

      - name: Install landing dependencies
        run: npm --prefix mesher/landing ci

      - name: Build landing
        env:
          NEXT_PUBLIC_SITE_URL: https://hyperpush.dev
        run: npm --prefix mesher/landing run build

  deploy-landing:
    name: Deploy landing to Fly.io
    needs: build-landing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master pinned 2026-07-16

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: mesher/landing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
